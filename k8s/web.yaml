apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  # Exactly one replica: the search job registry (JOBS in webapp.py) lives in
  # process memory, so a second pod wouldn't know about searches started on
  # the first. Scaling out needs that state moved to Redis/a queue first.
  replicas: 1
  # Recreate rather than RollingUpdate: a rolling update would briefly run
  # old and new pods side by side, splitting that same in-memory state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: cheap-flights-web  # tag set in kustomization.yaml
          imagePullPolicy: Always  # make k8s-dev switches this to Never
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: app-secrets, key: DB_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secrets, key: DB_PASSWORD}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: app-secrets, key: TELEGRAM_BOT_TOKEN, optional: true}
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef: {name: app-secrets, key: TELEGRAM_CHAT_ID, optional: true}
          # Startup: give gunicorn time to boot before liveness kicks in.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # Liveness: restart the container if the process stops answering.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          # Readiness: only route traffic here while Postgres is reachable.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          # Requests are what the scheduler reserves; the memory limit is the
          # hard ceiling (OOMKilled above it). Chromium instances during a
          # search are what drive usage — see SCRAPE_CONCURRENCY.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Chromium needs more shared memory than the 64 MB default (the
        # equivalent of shm_size in docker-compose.yml). Counts toward the
        # container's memory limit.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  ingressClassName: traefik
  rules:
    - host: flights.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
