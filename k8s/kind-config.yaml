# Local single-node Kubernetes cluster (kind = "Kubernetes in Docker").
# Created by `make k8s-up`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cheap-flights
nodes:
  - role: control-plane
    # http://<anything>.localhost:8081 on the host → Traefik's NodePort
    # inside the node. 8081 rather than 80 so nothing needs root and
    # nothing collides with other local servers.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        listenAddress: "127.0.0.1"
        protocol: TCP
