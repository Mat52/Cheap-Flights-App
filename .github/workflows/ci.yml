name: CI

# lint + test → build image → scan → push to GHCR (main only).
# The price watcher's "[skip ci]" history commits never trigger this.
on:
  push:
    branches: [main]
    paths-ignore:
      - "app/price_history.json"
      - "**.md"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch/PR supersedes a running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs, not tags — a tag can be
# moved to malicious code (as happened to trivy-action in March 2026), a
# commit SHA can't. The trailing comment records the human-readable version.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # No Playwright browsers or Postgres needed: tests cover pure logic,
      # and the database / Ollama are stubbed out.
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest
        run: pytest -v

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      security-events: write   # upload Trivy results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry paths must be lowercase; the repository owner may not be.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cheap-flights-web" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: sha-<short> always; pr-<n> on pull requests; latest on main.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Built and loaded locally first, so it's scanned before anything is
      # pushed. Layer cache is kept in the GitHub Actions cache.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            cheap-flights-web:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: fail on HIGH/CRITICAL vulnerabilities that have a fix available.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cheap-flights-web:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Full report (all severities, unfixed included) for the Security tab.
      - name: Trivy scan (report)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cheap-flights-web:scan
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          skip-setup-trivy: true

      - name: Upload scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"
