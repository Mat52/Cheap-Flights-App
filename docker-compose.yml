# All credentials come from .env at the repo root (see .env.example) —
# nothing is hardcoded here. ${VAR:?msg} aborts startup with a clear error
# when a required variable is missing.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cheap-flights-web:local
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Inside compose the database is always the "db" service; DB_HOST in
      # .env is for running the app directly on the host.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flights}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Ollama runs on the host machine, not in a container.
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-5}
      CACHE_MAX_AGE_MINUTES: ${CACHE_MAX_AGE_MINUTES:-30}
    ports:
      - "${PORT:-5000}:5000"
    # Chromium needs more than the default 64 MB of /dev/shm; tabs can crash
    # under concurrent scraping otherwise.
    shm_size: "1gb"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-flights}
    # Bound to localhost only. DB_PUBLISH_PORT is the host-side port (e.g.
    # 5433 when a local Postgres already holds 5432); the web service talks
    # to db over the compose network and doesn't use it.
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional; only started with `docker compose --profile tools up`.
  # Defaults instead of ${VAR:?} because compose interpolates services in
  # inactive profiles too, and pgAdmin shouldn't be a hard requirement.
  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
